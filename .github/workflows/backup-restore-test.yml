name: Encrypted backup restore test

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore:
    name: Isolated encrypted backup restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MGT_BACKUP_BUNDLE_B64: ${{ secrets.MGT_BACKUP_BUNDLE_B64 }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.MGT_BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify encryption and restore contracts
        run: pnpm test:encrypted-backup
      - name: Restore approved encrypted artifact when configured
        if: ${{ env.MGT_BACKUP_BUNDLE_B64 != '' && env.BACKUP_ENCRYPTION_KEY != '' }}
        run: |
          printf '%s' "$MGT_BACKUP_BUNDLE_B64" | base64 --decode > "$RUNNER_TEMP/mgt-backup.mgtenc.json"
          pnpm backup:restore-test -- --input "$RUNNER_TEMP/mgt-backup.mgtenc.json" --output-dir "$RUNNER_TEMP/mgt-restore" --candidate-commit "$GITHUB_SHA"
      - name: Report pending customer export configuration
        if: ${{ env.MGT_BACKUP_BUNDLE_B64 == '' || env.BACKUP_ENCRYPTION_KEY == '' }}
        run: echo "Encrypted backup contract passed; approved customer artifact/key references are not configured, so no production data was restored."

name: Publish Google Cloud release images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Reviewed GitHub environment and GCP project boundary
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: gcp-release-${{ inputs.environment }}-${{ github.sha }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_RELEASE_SERVICE_ACCOUNT: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
  NODE_IMAGE: ${{ vars.NODE_IMAGE }}

jobs:
  publish:
    name: Verify, build and publish immutable images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate infrastructure definitions without credentials
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra/gcp/bootstrap
          terraform fmt -check -recursive infra/gcp/platform
          terraform fmt -check -recursive infra/cloudflare
          terraform -chdir=infra/gcp/bootstrap init -backend=false -input=false
          terraform -chdir=infra/gcp/bootstrap validate
          terraform -chdir=infra/gcp/platform init -backend=false -input=false
          terraform -chdir=infra/gcp/platform validate
          terraform -chdir=infra/cloudflare init -backend=false -input=false
          terraform -chdir=infra/cloudflare validate
      - name: Run the complete candidate gate
        run: pnpm test:infra && pnpm test:application && pnpm test:compose-contract && pnpm test:lineage && pnpm test:verification
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GCP_PROJECT_ID"
          test -n "$GCP_REGION"
          test -n "$GAR_REPOSITORY"
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GCP_RELEASE_SERVICE_ACCOUNT"
          if [[ ! "$NODE_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]; then
            echo "NODE_IMAGE must be an approved immutable digest." >&2
            exit 1
          fi
      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Configure Artifact Registry authentication
        shell: bash
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/portal/Dockerfile.api
          push: true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/api:${{ github.sha }}
          build-args: NODE_IMAGE=${{ env.NODE_IMAGE }}
          provenance: mode=max
          sbom: true
      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/portal/Dockerfile.web
          push: true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/web:${{ github.sha }}
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            PORTAL_API_ORIGIN=http://127.0.0.1:3100
          provenance: mode=max
          sbom: true
      - name: Attest API image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest web image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Create candidate-bound image manifest
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          API_NAME="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/api"
          WEB_NAME="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/web"
          node infra/portal/release-image-manifest.mjs \
            --candidate "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --api-image "$API_NAME@$API_DIGEST" \
            --web-image "$WEB_NAME@$WEB_DIGEST" \
            --output work/image-publication/gcp-release-images.json
      - name: Preserve the Terraform handoff manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gcp-release-images-${{ inputs.environment }}-${{ github.sha }}
          path: work/image-publication/gcp-release-images.json
          if-no-files-found: error
          retention-days: 90

# This name is supplied only by the private deployment-control file. It keeps
# staging and production networks, containers, and named volumes disjoint even
# when they run on the same approved host.
name: ${MGT_COMPOSE_PROJECT_NAME:?Set a unique stage-scoped Compose project identifier}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-application-runtime: &application-runtime
  init: true
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  logging: *default-logging

# Each workload receives two separate private deployment inputs: reviewed
# non-secret configuration and secret-manager materialization. Neither input is
# a repository file or shared between services. The later secret file wins if a
# key is accidentally repeated, while runtime admission rejects peer secrets.
x-api-runtime-input: &api-runtime-input
  env_file:
    - ${API_RUNTIME_CONFIG_FILE:?Set the noncommitted API non-secret runtime configuration path}
    - ${API_RUNTIME_SECRETS_FILE:?Set the noncommitted API secret materialization path from the approved secret manager}

x-worker-runtime-input: &worker-runtime-input
  env_file:
    - ${WORKER_RUNTIME_CONFIG_FILE:?Set the noncommitted worker non-secret runtime configuration path}
    - ${WORKER_RUNTIME_SECRETS_FILE:?Set the noncommitted worker secret materialization path from the approved secret manager}

x-edge-runtime-input: &edge-runtime-input
  env_file:
    - ${EDGE_RUNTIME_CONFIG_FILE:?Set the noncommitted edge non-secret runtime configuration path}
    - ${EDGE_RUNTIME_SECRETS_FILE:?Set the noncommitted edge secret materialization path from the approved secret manager}

services:
  api:
    <<: [*application-runtime, *api-runtime-input]
    image: ${API_IMAGE:?Set the approved immutable API image digest}
    pull_policy: always
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      HOST: 0.0.0.0
      PORT: 3100
      PROCESS_ROLE: api
      PORTAL_AUTO_MIGRATE: "false"
    expose:
      - "3100"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "2.0"
    mem_limit: 2g

  worker:
    <<: [*application-runtime, *worker-runtime-input]
    image: ${API_IMAGE:?Set the approved immutable API image digest}
    pull_policy: always
    command: ["sh", "-c", "node /app/infra/portal/preflight.mjs && exec node dist/portal/worker.js"]
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      PROCESS_ROLE: worker
      PORTAL_AUTO_MIGRATE: "false"
      WORKER_HEALTH_FILE: /tmp/mgt-worker-health.json
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs'),f=process.env.WORKER_HEALTH_FILE,a=process.env.WORKER_READINESS_MAX_AGE_SECONDS,valid=typeof f==='string'&&f.length>0&&typeof a==='string'&&/^\\d+$/.test(a)&&Number.isSafeInteger(Number(a))&&Number(a)>0;fs.stat(f||'',(e,s)=>process.exit(valid&&!e&&Date.now()-s.mtimeMs<Number(a)*1000?0:1));"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    cpus: "1.0"
    mem_limit: 1g

  web:
    <<: *application-runtime
    image: ${WEB_IMAGE:?Set the approved immutable web image digest}
    pull_policy: always
    # The browser service gets only its private upstream address. This is a
    # non-secret runtime setting, deliberately separate from manager output.
    environment:
      PORTAL_API_ORIGIN: http://api:3100
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "1.0"
    mem_limit: 1g

  edge:
    <<: *edge-runtime-input
    image: ${CADDY_IMAGE:?Set the approved immutable Caddy image digest}
    pull_policy: always
    ports:
      - "${MGT_EDGE_HTTP_PORT:?Set the stage-scoped edge HTTP host port}:80"
      - "${MGT_EDGE_HTTPS_PORT:?Set the stage-scoped edge HTTPS host port}:443"
    environment:
      NODE_ENV: production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
    cpus: "1.0"
    mem_limit: 512m
    logging: *default-logging

  ollama:
    image: ${OLLAMA_IMAGE:?Set the approved immutable Ollama image digest}
    pull_policy: always
    profiles: ["local-ai"]
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
    cpus: "4.0"
    mem_limit: 12g
    logging: *default-logging

volumes:
  certificates:
  caddy_config:
  ollama:

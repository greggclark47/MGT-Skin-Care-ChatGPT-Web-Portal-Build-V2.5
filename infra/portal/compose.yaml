x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
  api:
    build:
      context: ../..
      dockerfile: infra/portal/Dockerfile.api
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?Set the reviewed Supabase database connection}
      PORTAL_AUTO_MIGRATE: "false"
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      OPENCLAW_BASE_URL: http://ollama:11434/v1
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
  worker:
    build:
      context: ../..
      dockerfile: infra/portal/Dockerfile.api
    command: ["node", "dist/portal/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the reviewed Supabase database connection}
      PORTAL_AUTO_MIGRATE: "false"
      WORKER_INTERVAL_SECONDS: "60"
      PROCESS_ROLE: worker
      WORKER_HEALTH_FILE: /tmp/mgt-worker-health.json
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    logging: *default-logging
  web:
    build:
      context: ../..
      dockerfile: infra/portal/Dockerfile.web
      args:
        PORTAL_API_ORIGIN: http://api:3100
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
  edge:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Set portal domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
volumes:
  certificates:
  ollama:
